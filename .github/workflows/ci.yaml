name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level critical
      - run: pnpm run lint
      - run: pnpm run ts
      - run: pnpm run test:unit --runInBand
      - run: pnpm run build
      - run: pnpm pack --pack-destination package
      - run: bash scripts/check-package.sh package/react-spreadsheet-import-*.tgz
      - run: pnpm exec playwright install --with-deps
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push'
        with:
          name: importer-package
          path: package/react-spreadsheet-import-*.tgz
          if-no-files-found: error
          overwrite: true

  release:
    if: github.event_name == 'push' && github.repository == 'TryPlantiful/react-spreadsheet-import'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: importer-release-${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: importer-package
          path: package
      - name: Publish package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="importer-$GITHUB_SHA"

          set -- package/react-spreadsheet-import-*.tgz
          test "$#" -eq 1
          test -f "$1"
          asset="$1"

          draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' || true)"
          if [ "$draft" = true ]; then
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false --latest=false
          elif [ "$draft" != false ]; then
            gh release create "$tag" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Verified package for commit $GITHUB_SHA." \
              --prerelease \
              --latest=false
          fi

          immutable="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable')"
          if [ "$immutable" != true ]; then
            echo "::error::This release is mutable. Check the fork's release immutability setting."
            exit 1
          fi
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
          test "$source_sha" = "$GITHUB_SHA"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Fx -- "$(basename "$asset")"
